---
- name: Render ADVPN lab configs
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Ensure rendered output directory exists
      ansible.builtin.file:
        path: rendered
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Validate common required variables
      ansible.builtin.assert:
        that:
          - site_name is defined
          - site_slug is defined
          - lan is defined
          - lan.interface is defined
          - lan.ip is defined
          - wan is defined
          - wan.wan1 is defined
          - wan.wan1.interface is defined
          - wan.wan2 is defined
          - wan.wan2.interface is defined
          - device_role is defined
          - device_role in ["hub", "branch"]
        fail_msg: "Missing required common variables for {{ inventory_hostname }}."
      delegate_to: localhost

    - name: Build normalized hostname and render timestamp
      ansible.builtin.set_fact:
        normalized_hostname: >-
          {{
            (
              site_slug
              | default(site_name)
              | lower
              | regex_replace('[^a-z0-9-]+', '-')
              | regex_replace('(^-+|-+$)', '')
            )
          }}
        render_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%d-%H%M%SZ') }}"
      delegate_to: localhost

    - name: Normalize ADVPN variable structure
      ansible.builtin.set_fact:
        ike_version: "{{ advpn.phase1.ike_version | default(ike_version, true) }}"
        proposal: "{{ advpn.phase1.proposal | default(proposal, true) }}"
        dhgrp: "{{ advpn.phase1.dhgrp | default(dhgrp, true) }}"
        psksecret: "{{ advpn.phase1.psksecret | default(psksecret, true) }}"
        net_device: "{{ advpn.phase1.net_device | default(net_device, true) }}"
        mode_cfg: "{{ advpn.phase1.mode_cfg | default(mode_cfg, true) }}"
        add_route: "{{ advpn.phase1.add_route | default(add_route, true) }}"
        auto_discovery_receiver: "{{ advpn.phase1.auto_discovery_receiver | default(auto_discovery_receiver, true) }}"
        auto_discovery_shortcuts: "{{ advpn.phase1.auto_discovery_shortcuts | default(auto_discovery_shortcuts, true) }}"
        network_overlay: "{{ advpn.phase1.network_overlay | default(network_overlay, true) }}"
        phase2: "{{ advpn.phase2 | default(phase2, true) }}"
        tunnel_matrix: "{{ advpn.tunnels | default(tunnel_matrix, true) }}"
        sdwan_health_checks: "{{ advpn.sdwan.branch.health_checks | default(sdwan_health_checks, true) }}"
        sdwan_services: "{{ advpn.sdwan.branch.services | default(sdwan_services, true) }}"
        sdwan_inet_service: "{{ advpn.sdwan.branch.inet_service | default(sdwan_inet_service, true) }}"
        hub_sdwan_inet_service: "{{ advpn.sdwan.hub.inet_service | default(hub_sdwan_inet_service, true) }}"
        hub_sdwan_route_services: "{{ advpn.sdwan.hub.route_services | default(hub_sdwan_route_services, true) }}"
        branch_route_maps: >-
          {{
            advpn.branch.route_maps
            | default(branch_route_maps, true)
            | combine(
                {
                  'preferable': (
                    (
                      advpn.branch.route_maps.preferable
                      if (
                        advpn is defined and
                        advpn.branch is defined and
                        advpn.branch.route_maps is defined and
                        advpn.branch.route_maps.preferable is defined
                      )
                      else branch_route_maps.preferable
                      if (branch_route_maps is defined and branch_route_maps.preferable is defined)
                      else [
                        {
                          'name': t.name,
                          'network_id': t.network_id,
                          'community': (advpn.bgp.asn | string) ~ ':' ~ (t.network_id | string)
                        }
                        for t in (advpn.tunnels | default(tunnel_matrix, true))
                      ]
                    )
                  )
                },
                recursive=True
              )
          }}
        interhub_ipsec: "{{ advpn.interhub_ipsec | default(interhub_ipsec, true) }}"
      delegate_to: localhost

    - name: Derive branch BGP route-map names from fail route-map definitions
      ansible.builtin.set_fact:
        branch_bgp_route_maps: >-
          {{
            advpn.branch.bgp_route_maps
            if (
              advpn is defined and
              advpn.branch is defined and
              advpn.branch.bgp_route_maps is defined
            )
            else dict(
              (
                branch_route_maps.fail
                | dict2items
                | map(attribute='key')
                | zip(
                    branch_route_maps.fail
                    | dict2items
                    | map(attribute='value')
                    | map(attribute='name')
                  )
              )
            )
          }}
      delegate_to: localhost

    - name: Validate normalized hostname
      ansible.builtin.assert:
        that:
          - normalized_hostname | length > 0
        fail_msg: "Hostname slug resolves to an empty value for {{ inventory_hostname }}."
      delegate_to: localhost

    - name: Ensure per-host rendered output directory exists
      ansible.builtin.file:
        path: rendered/{{ normalized_hostname }}
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Validate hub required variables
      ansible.builtin.assert:
        that:
          - hub_overlay_interfaces is defined
          - hub_overlay_interfaces | length > 0
          - interhub is defined
          - interhub.tunnel_name is defined
          - interhub.phase2_name is defined
          - interhub.policy_name is defined
          - interhub.parent_interface is defined
          - interhub.localid is defined
          - interhub.remote_gw is defined
          - interhub.tunnel_ip is defined
          - interhub.remote_tunnel_ip is defined
          - hub_community_lists is defined
          - hub_community_lists[inventory_hostname] is defined
          - lo_hc is defined
          - lo_hc.interface is defined
          - lo_hc.ip is defined
        fail_msg: "Missing required hub variables for {{ inventory_hostname }}."
      when: device_role == "hub"
      delegate_to: localhost

    - name: Validate branch required variables
      ansible.builtin.assert:
        that:
          - lan.subnet is defined
          - lan.dhcp_start is defined
          - lan.dhcp_end is defined
          - lo_hc is defined
          - lo_hc.interface is defined
          - lo_hc.ip is defined
        fail_msg: "Missing required branch variables for {{ inventory_hostname }}."
      when: device_role == "branch"
      delegate_to: localhost

  tasks:
    - name: Render baseline config
      ansible.builtin.template:
        src: templates/musthaves.j2
        dest: rendered/{{ normalized_hostname }}/01-baseline.conf
      delegate_to: localhost

    - name: Render interfaces config
      ansible.builtin.template:
        src: templates/interfaces.j2
        dest: rendered/{{ normalized_hostname }}/02-interfaces.conf
      delegate_to: localhost

    - name: Render hub phase1 config
      ansible.builtin.template:
        src: templates/hub_phase1.j2
        dest: rendered/{{ normalized_hostname }}/03-phase1.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub tunnel allowaccess config
      ansible.builtin.template:
        src: templates/hub_tunnel_allowaccess.j2
        dest: rendered/{{ normalized_hostname }}/04-tunnel-allowaccess.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub phase2 config
      ansible.builtin.template:
        src: templates/hub_phase2.j2
        dest: rendered/{{ normalized_hostname }}/05-phase2.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub community lists
      ansible.builtin.template:
        src: templates/community_lists.j2
        dest: rendered/{{ normalized_hostname }}/06-community-lists.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub route-maps
      ansible.builtin.template:
        src: templates/route_maps_hub.j2
        dest: rendered/{{ normalized_hostname }}/07-route-maps.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub SD-WAN config
      ansible.builtin.template:
        src: templates/sdwan_hub.j2
        dest: rendered/{{ normalized_hostname }}/08-sdwan.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render hub BGP config
      ansible.builtin.template:
        src: templates/bgp_hub.j2
        dest: rendered/{{ normalized_hostname }}/09-bgp.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render branch phase1 config
      ansible.builtin.template:
        src: templates/branch_phase1.j2
        dest: rendered/{{ normalized_hostname }}/03-phase1.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render branch tunnel allowaccess config
      ansible.builtin.template:
        src: templates/branch_tunnel_allowaccess.j2
        dest: rendered/{{ normalized_hostname }}/04-tunnel-allowaccess.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render branch phase2 config
      ansible.builtin.template:
        src: templates/branch_phase2.j2
        dest: rendered/{{ normalized_hostname }}/05-phase2.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render branch route-maps
      ansible.builtin.template:
        src: templates/route_maps_branch.j2
        dest: rendered/{{ normalized_hostname }}/06-route-maps.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render branch SD-WAN config
      ansible.builtin.template:
        src: templates/sdwan_branch.j2
        dest: rendered/{{ normalized_hostname }}/07-sdwan.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render branch BGP config
      ansible.builtin.template:
        src: templates/bgp_branch.j2
        dest: rendered/{{ normalized_hostname }}/08-bgp.conf
      when: device_role == "branch"
      delegate_to: localhost

    - name: Render hub inter-hub IPsec config
      ansible.builtin.template:
        src: templates/hub_interhub_ipsec.j2
        dest: rendered/{{ normalized_hostname }}/10-interhub-ipsec.conf
      when: device_role == "hub"
      delegate_to: localhost

    - name: Render full merged config in section order
      ansible.builtin.assemble:
        src: rendered/{{ normalized_hostname }}
        regexp: '^[0-9]{2}-.*\.conf$'
        dest: rendered/{{ normalized_hostname }}-full-{{ render_timestamp }}.conf
      delegate_to: localhost
