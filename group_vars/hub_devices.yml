# Device role used by templates/playbook branching.
# Used by: ADVPN 1.0, ADVPN 2.0, and BGP on loopback/per-overlay logic.
device_role: hub

# Hub override for net_device in specific template contexts.
# Used by: ADVPN 1.0 and ADVPN 2.0 tunnel interface behavior.
net_device: disable

# Community-list definitions used by hub route-map/BGP policy.
# Used by: ADVPN 1.0, ADVPN 2.0, and BGP on loopback/per-overlay logic.
hub_community_lists:
  dallas:
    - name: HUB-1
      match: "65152:1"
    - name: HUB-2
      match: "65152:2"
    - name: HUB-3
      match: "65152:3"
    - name: HUB-4
      match: "65152:4"
    - name: HUB-FAIL
      match: "65152:99"

  chicago:
    - name: HUB-5
      match: "65152:5"
    - name: HUB-6
      match: "65152:6"
    - name: HUB-7
      match: "65152:7"
    - name: HUB-8
      match: "65152:8"
    - name: HUB-FAIL
      match: "65152:99"
