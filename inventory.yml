    ansible_connection: ssh
    ansible_user: admin
    ansible_password: pass
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    hubs:
      dallas:
        wan1_gw: 100.64.0.10
        wan2_gw: 100.65.0.10
        vpn_ids:
          wan1:
            - 1
            - 3
          wan2:
            - 2
            - 4

      chicago:
        wan1_gw: 100.64.0.20
        wan2_gw: 100.65.0.20
        vpn_ids:
          wan1:
            - 5
            - 7
          wan2:
            - 6
            - 8

