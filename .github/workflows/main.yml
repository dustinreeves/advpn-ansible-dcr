name: Run Ansible and upload artifacts

on:
  push:
    branches:
      - main
      - master
      - develop
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Galaxy requirements
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy install -r requirements.yml
          fi

      - name: Show Ansible version
        run: ansible --version

      - name: Syntax check
        run: ansible-playbook -i inventory.yml playbook.yml --syntax-check

      - name: Run playbook
        run: ansible-playbook -i inventory.yml playbook.yml

      - name: Show generated files
        run: |
          echo "Repo contents after playbook run:"
          find . -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ansible-output
          path: |
            output/**
            artifacts/**
            rendered/**
            *.cfg
            *.conf
            *.txt
            *.log
          if-no-files-found: warn
          retention-days: 14
